name: AWS – Read-only Diagnostic

# Read-only, deliberately minimal. Answers two questions during an outage:
#   1. do the repo's AWS credentials still work?
#   2. is the production instance running, and are its status checks passing?
# It prints NO console output, no volumes, no addresses, no databases — that
# detail belongs in a local CLI session, not in a job log anyone with repo read
# access can open. Every step tolerates a denied permission.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Credentials valid?
        run: aws sts get-caller-identity --query 'Arn' --output text | sed -E 's#user/.*#user/<redacted>#' || true

      - name: Production instance state
        run: |
          aws ec2 describe-instance-status --include-all-instances \
            --instance-ids i-08cb1a1cf79628ab8 \
            --query 'InstanceStatuses[].{State:InstanceState.Name,SystemCheck:SystemStatus.Status,InstanceCheck:InstanceStatus.Status,Events:Events[].Description}' \
            --output table || true
